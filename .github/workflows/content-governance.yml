name: Content governance
on:
  pull_request:
    branches: [main]
    paths:
      - "docs/content/**"
      - "scripts/content-governance.mjs"
      - "tests/content-governance.test.mjs"
      - "package.json"
      - ".github/workflows/content-governance.yml"
  push:
    branches: [main]
    paths:
      - "docs/content/**"
      - "scripts/content-governance.mjs"
      - "tests/content-governance.test.mjs"
      - "package.json"
      - ".github/workflows/content-governance.yml"
permissions:
  contents: read
jobs:
  content-register:
    name: Validate content evidence and freshness gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: npm run test:content
      - run: npm run validate:content
