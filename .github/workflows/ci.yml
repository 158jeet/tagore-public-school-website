name: Website CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tps-quality:
    name: TPS website quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:security
      - run: npm run lint
      - run: npm run build
  tier-quality:
    name: TIER website quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tier
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
