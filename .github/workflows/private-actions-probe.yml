name: Private Actions runner probe

on:
  push:
    branches:
      - diagnostics/private-actions-runner-probe

permissions:
  contents: read

jobs:
  runner-probe:
    name: Minimal hosted runner allocation
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm runner allocation
        run: |
          echo "Private GitHub Actions runner was allocated."
          echo "UTC time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
